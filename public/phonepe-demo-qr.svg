<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="phonepeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5f259f"/>
      <stop offset="100%" stop-color="#4a1584"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="460" rx="24" fill="#ffffff" stroke="#e9d5ff" stroke-width="2" filter="url(#shadow)"/>

  <!-- PhonePe Header Bar -->
  <path d="M 10 34 Q 10 10 34 10 L 366 10 Q 390 10 390 34 L 390 85 L 10 85 Z" fill="url(#phonepeGrad)"/>
  
  <!-- PhonePe Logo Icon -->
  <circle cx="50" cy="48" r="22" fill="#ffffff"/>
  <!-- PhonePe Devanagari Pe Icon -->
  <text x="50" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#5f259f" text-anchor="middle">पे</text>

  <!-- PhonePe Text -->
  <text x="85" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="0.5">PhonePe</text>
  <text x="85" y="64" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#e9d5ff" letter-spacing="1">ACCEPTED HERE</text>

  <!-- Merchant Name Badge -->
  <rect x="30" y="100" width="340" height="48" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="200" y="122" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" fill="#0f172a" text-anchor="middle">VARIETY MOMO</text>
  <text x="200" y="138" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748b" text-anchor="middle">UPI ID: 7827423777@ybl</text>

  <!-- QR Code Container Box -->
  <rect x="50" y="160" width="300" height="240" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- QR Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
  <!-- Top-Left -->
  <rect x="75" y="185" width="55" height="55" rx="6" fill="#1e1b4b"/>
  <rect x="83" y="193" width="39" height="39" rx="3" fill="#ffffff"/>
  <rect x="91" y="201" width="23" height="23" rx="2" fill="#5f259f"/>

  <!-- Top-Right -->
  <rect x="270" y="185" width="55" height="55" rx="6" fill="#1e1b4b"/>
  <rect x="278" y="193" width="39" height="39" rx="3" fill="#ffffff"/>
  <rect x="286" y="201" width="23" height="23" rx="2" fill="#5f259f"/>

  <!-- Bottom-Left -->
  <rect x="75" y="325" width="55" height="55" rx="6" fill="#1e1b4b"/>
  <rect x="83" y="333" width="39" height="39" rx="3" fill="#ffffff"/>
  <rect x="91" y="341" width="23" height="23" rx="2" fill="#5f259f"/>

  <!-- Stylized QR Grid Dots -->
  <g fill="#334155">
    <!-- Row 1 -->
    <rect x="145" y="185" width="12" height="12" rx="2"/>
    <rect x="165" y="185" width="12" height="12" rx="2"/>
    <rect x="195" y="185" width="12" height="12" rx="2"/>
    <rect x="225" y="185" width="12" height="12" rx="2"/>
    <rect x="245" y="185" width="12" height="12" rx="2"/>

    <!-- Row 2 -->
    <rect x="145" y="205" width="12" height="12" rx="2"/>
    <rect x="180" y="205" width="25" height="12" rx="2"/>
    <rect x="220" y="205" width="15" height="12" rx="2"/>
    <rect x="245" y="205" width="12" height="12" rx="2"/>

    <!-- Row 3 -->
    <rect x="165" y="225" width="15" height="15" rx="2"/>
    <rect x="200" y="225" width="20" height="15" rx="2"/>
    <rect x="235" y="225" width="15" height="15" rx="2"/>

    <!-- Center PhonePe Badge in QR -->
    <circle cx="200" cy="280" r="24" fill="#ffffff" stroke="#5f259f" stroke-width="3"/>
    <circle cx="200" cy="280" r="20" fill="#5f259f"/>
    <text x="200" y="287" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">पे</text>

    <!-- Bottom Dots -->
    <rect x="145" y="315" width="12" height="12" rx="2"/>
    <rect x="165" y="315" width="20" height="12" rx="2"/>
    <rect x="225" y="315" width="25" height="12" rx="2"/>
    <rect x="260" y="315" width="12" height="12" rx="2"/>

    <rect x="145" y="340" width="25" height="12" rx="2"/>
    <rect x="180" y="340" width="12" height="12" rx="2"/>
    <rect x="220" y="340" width="15" height="12" rx="2"/>
    <rect x="275" y="340" width="20" height="12" rx="2"/>

    <rect x="155" y="365" width="15" height="15" rx="2"/>
    <rect x="185" y="365" width="25" height="15" rx="2"/>
    <rect x="235" y="365" width="20" height="15" rx="2"/>
    <rect x="270" y="365" width="15" height="15" rx="2"/>
  </g>

  <!-- Clear DEMO QR Watermark Overlay -->
  <g transform="rotate(-18 200 280)">
    <rect x="40" y="260" width="320" height="42" rx="8" fill="#dc2626" opacity="0.92"/>
    <text x="200" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">DEMO PHONEPE QR CODE</text>
    <text x="200" y="293" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#fecaca" text-anchor="middle">REPLACE VIA RESTAURANT SETTINGS</text>
  </g>

  <!-- Bottom Supported Apps Bar -->
  <rect x="30" y="415" width="340" height="42" rx="10" fill="#f1f5f9"/>
  <text x="50" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#475569">Scan with any UPI App:</text>
  <text x="200" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#5f259f">PhonePe</text>
  <text x="260" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#1e40af">GPay</text>
  <text x="300" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#0284c7">Paytm</text>
  <text x="345" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#0f766e">BHIM</text>
</svg>
