    <meta charset="UTF-8" />

    <title>Variety Momo | Fresh, Hot & Delicious Momos in Mecheda</title>
    <meta name="description" content="Order fresh, hot & authentic momos, crunchy tandoori, tikka, rice, chowmein, and fast food from Variety Momo in Mecheda, West Bengal. Mobile ordering for Dine-In & Home Delivery." />
    <meta name="theme-color" content="#E23744" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Variety Momo" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="application-name" content="Variety Momo" />
    <meta name="msapplication-TileColor" content="#E23744" />

    <!-- Early PWA Install Prompt Capture: Ensures beforeinstallprompt is never lost on fast loads -->
    <script>
      (function() {
        window.deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
          window.dispatchEvent(new CustomEvent('variety-momo-pwa-ready'));
        });
        window.addEventListener('appinstalled', function() {
          window.deferredPwaPrompt = null;
          try {
            localStorage.setItem('variety_momo_pwa_installed', 'true');
          } catch (_) {}
          window.dispatchEvent(new CustomEvent('variety-momo-pwa-installed'));
        });
      })();
    </script>
  </head>

  </body>
